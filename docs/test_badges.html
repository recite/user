<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Test</title>
</head>
<body>
    <h1>Badge Generation Test</h1>
    
    <h2>Generated SVG Badge:</h2>
    <div id="badge-container"></div>
    
    <h2>Badge Code:</h2>
    <pre id="badge-code"></pre>

    <script>
        // Copy the generateBadgeSVG function from app.js
        function generateBadgeSVG(label, value, color = '#007aff') {
            const labelWidth = label.length * 6 + 12;
            const valueWidth = value.toString().length * 6 + 12;
            const totalWidth = labelWidth + valueWidth;
            
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${totalWidth}" height="20">
                <linearGradient id="b" x2="0" y2="100%">
                    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
                    <stop offset="1" stop-opacity=".1"/>
                </linearGradient>
                <clipPath id="a">
                    <rect width="${totalWidth}" height="20" rx="3" fill="#fff"/>
                </clipPath>
                <g clip-path="url(#a)">
                    <path fill="#555" d="M0 0h${labelWidth}v20H0z"/>
                    <path fill="${color}" d="M${labelWidth} 0h${valueWidth}v20H${labelWidth}z"/>
                    <path fill="url(#b)" d="M0 0h${totalWidth}v20H0z"/>
                </g>
                <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
                    <text x="${labelWidth / 2}" y="15" fill="#010101" fill-opacity=".3">${label}</text>
                    <text x="${labelWidth / 2}" y="14">${label}</text>
                    <text x="${labelWidth + valueWidth / 2}" y="15" fill="#010101" fill-opacity=".3">${value}</text>
                    <text x="${labelWidth + valueWidth / 2}" y="14">${value}</text>
                </g>
            </svg>`;
        }
        
        // Test the badge generation
        document.addEventListener('DOMContentLoaded', () => {
            const badge = generateBadgeSVG('Python Usage', '#1');
            document.getElementById('badge-container').innerHTML = badge;
            document.getElementById('badge-code').textContent = badge;
        });
    </script>
</body>
</html>
